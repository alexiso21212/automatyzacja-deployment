apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deployment-demo-app
  template:
    metadata:
      labels:
        app: deployment-demo-app
    spec:
      containers:
        - name: web
          # W realnym klastrze ustaw tu obraz opublikowany w rejestrze, np. GHCR.
          image: deployment-demo-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: deployment-demo-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: deployment-demo-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: deployment-demo-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: deployment-demo-service
spec:
  type: NodePort
  selector:
    app: deployment-demo-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
